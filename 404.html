<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex, follow"/>
<title>Page not found, The One Club</title>
<link rel="preload" href="/style.css" as="style"/>
<link rel="stylesheet" href="/style.css"/>
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 24px;text-align:center}
  .e-wrap{max-width:520px}
  .e-num{font-size:clamp(88px,14vw,160px);font-weight:300;letter-spacing:-4px;color:var(--gold);line-height:1;margin-bottom:8px}
  .e-title{font-size:clamp(28px,4vw,42px);font-weight:400;letter-spacing:-1px;margin-bottom:20px}
  .e-body{font-size:15px;color:var(--muted);max-width:380px;margin:0 auto 32px;line-height:1.6}
  .e-cta{display:inline-flex;gap:14px;flex-wrap:wrap;justify-content:center}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
<link rel="icon" href="/favicon.ico"/>
<link rel="manifest" href="/site.webmanifest"/>
<meta name="theme-color" content="#2C5530"/>
</head>
<body>
<main class="e-wrap">
  <div class="e-num">404</div>
  <h1 class="e-title">Page not found</h1>
  <p class="e-body">The page you were looking for has moved, been renamed, or never existed. Head home and we&rsquo;ll get you back on track.</p>
  <div class="e-cta">
    <a href="/" class="btn btn-gold">Back to Home</a>
    <a href="/for-sale/" class="btn btn-outline">Browse Listings</a>
  </div>
  <p style="margin-top:36px;font-size:12px;color:var(--muted)">Still stuck? Call <a href="tel:+61404774272" style="color:var(--muted)">+61 404 774 272</a> or email <a href="mailto:bobby@theoneclub.com.au" style="color:var(--muted)">bobby@theoneclub.com.au</a>.</p>
</main>
<script src="/assets/region.js" defer></script>

  <!-- MOBILE CTA BAR -->
  <div class="mobile-cta-bar">
    <div class="row">
      <a href="tel:+61404774272" class="tel" aria-label="Call Bobby" onclick="if(window.trackAction) trackAction('mobile_dock_call')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      </a>
      <a href="/#valuation" class="btn btn-outline" style="background:var(--surface-1);border-color:rgba(var(--fg-rgb),.12)" onclick="if(window.trackAction) trackAction('mobile_dock_val')">1% Valuation</a>
      <button class="btn btn-gold" onclick="if(window.chatApp && chatApp.toggle) chatApp.toggle(); else document.getElementById('chat-bubble').click(); if(window.trackAction) trackAction('mobile_dock_chat')" style="border:none">Ask AI</button>
    </div>
  </div>

</body>
</html>
